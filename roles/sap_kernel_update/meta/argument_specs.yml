argument_specs:
  main:
    short_description: Role replaces existing SAP kernel with kernel provided in SAP CAR files.
    description:
      - Role replaces existing SAP kernel with kernel provided in SAP CAR files.
    options:
      sap_kernel_update_instance:
        description: |
          The instance number to be managed.
        type: str
        required: true
      sap_force_update:
        description: |
          Update the system if rolling upgrade can't be used. Stop and start the system, so there is downtime.
        type: str
        default: false
        required: false
      sap_kernel_update_sid:
        description: |
          SAP System ID.
        type: str
        required: true
      sap_kernel_update_kernel_path:
        description: |
          Path to directory with installed SAP kernel.
        type: str
        required: true
      sap_kernel_update_new_kernel_path:
        description: |
          Path to new kernel.
        type: str
        required: true
      sap_kernel_update_backup:
        description: |
          Backup previous kernel.
        type: str
        default: true
        required: false
      sap_kernel_update_kernel_backup_suffix:
        description: |
          Suffix that will be appended to the backup of the previous kernel.
        type: str
        default: backup-{{ ansible_date_time.iso8601_basic_short }}
        required: false

  __limitations__:
    options: {}
    short_description: Limitations
    description:
      - None

  __dependencies__:
    options: {}
    short_description: Dependencies
    description:
      - Role has no dependencies to other roles.

  __requirements__:
    options: {}
    short_description: Requirements
    description:
      - Most role tasks must be executed under root account. Some tasks are executed under sidadm account.
      - SAPCAR binary must be installed on the host

  __examples__:
    options: {}
    short_description: Example Playbooks
    description:
      - |
        ```ansible
        - hosts: all
          tasks:
            - name: Update SAP kernel
              ansible.builtin.include_role:
                name: sap.sap_operations.sap_kernel_update
              vars:
                sap_kernel_update_sid: S4H
                sap_kernel_update_instance: "00"
                sap_kernel_update_kernel_path: /usr/sap/S4H/SYS/exe/uc/linuxx86_64
                sap_kernel_update_new_kernel_path: /tmp/new_kernel
        ```

  __license__:
    options: {}
    short_description: License
    description:
      - GPL-3.0-only

  __author__:
    options: {}
    short_description: Author Information
    description:
      - Red Hat, Inc.
